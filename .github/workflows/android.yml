name: Android APK
on:
  push:
    branches: [main, mejoras-sin-perder-original]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)"; fi
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore persistent signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is missing. Refusing an APK signed with a temporary key."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > app/mensajeapp-release.jks
          chmod 600 app/mensajeapp-release.jks
      - name: Compile Android debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Sign APK with persistent certificate when configured
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || exit 1
          test -n "$KEYSTORE_PASSWORD" && test -n "$KEY_PASSWORD"
          ZIPALIGN="$ANDROID_HOME/build-tools/35.0.0/zipalign"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$ZIPALIGN" -f -p 4 app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/app-aligned.apk
          "$APKSIGNER" sign --ks app/mensajeapp-release.jks --ks-key-alias mensajeapp --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEY_PASSWORD --out app/build/outputs/apk/debug/app-signed.apk app/build/outputs/apk/debug/app-aligned.apk
          mv app/build/outputs/apk/debug/app-signed.apk app/build/outputs/apk/debug/app-debug.apk
          rm -f app/build/outputs/apk/debug/app-aligned.apk
          "$APKSIGNER" verify --verbose app/build/outputs/apk/debug/app-debug.apk
      - name: Show APK signing fingerprints for Firebase
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/debug/app-debug.apk | tee signing-fingerprints.txt
          echo 'Fingerprint above is from the APK signed with the persistent certificate.'
      - name: Verify APK was generated
        run: test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MensajeApp-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
